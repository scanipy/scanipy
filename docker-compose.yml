# Scanipy v3.2 — one-command self-host deployment (DOCKER-01, CLAR-DEPLOY-25).
#
#     docker compose up --build
#     open http://localhost:8000     # paste a public GitHub repo → findings
#
# NO cloud account, NO AWS. Two services: Postgres (substrate, migrated on start)
# and the Scanipy scan API (oracle-passthrough detection via Semgrep). The
# deterministic-core IFDS/CPG engine is staged and not on this path yet.
#
# (docker-compose.dev.yml remains the DB-only file for running the test suite on
#  the host; this file is the packaged application deployment.)

services:
  db:
    container_name: scanipy-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanipy
      # Override in .env for anything beyond a local trial: SCANIPY_DB_PASSWORD=...
      POSTGRES_PASSWORD: ${SCANIPY_DB_PASSWORD:-scanipy_dev}
      POSTGRES_DB: scanipy_dev
    volumes:
      - scanipy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanipy -d scanipy_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  scanipy:
    container_name: scanipy-app
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SCANIPY_DATABASE_URL: postgresql://scanipy:${SCANIPY_DB_PASSWORD:-scanipy_dev}@db:5432/scanipy_dev
      SCANIPY_ENV: development
      SCANIPY_S_VERSION: oracle-2026.08
      LLM_TRIAGE: "off"
    # The API is unauthenticated — bind to loopback by default. Put it behind your
    # own reverse proxy / auth to expose it beyond localhost.
    ports:
      - "127.0.0.1:8000:8000"
    # Hardening: this service parses untrusted repositories, so lock it down.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 2g
    pids_limit: 512
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  scanipy-pgdata:
