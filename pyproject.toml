[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanipy"
version = "3.2.0"
description = "Multi-tenant SaaS SAST platform — deterministic taint analysis via IFDS/IDE"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    # CMP-FND-03 signs provenance records via KMS and verifies RSASSA-PSS
    # signatures locally (AC-FND-03a: verify without re-running analysis).
    # The verifier in services/scan/provenance uses cryptography; declare it so
    # CI's lint (mypy-strict) and test jobs install it rather than relying on a
    # transitive presence that does not exist.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Pin the linter/type-checker to the versions the tree was formatted against.
    # ruff's `format` changed in 0.16 (it now rewrites aligned inline comments),
    # so an unpinned `>=` floats CI onto a formatter that reports repo-wide diffs
    # even on no-op branches (broke PR #336's Lint gate; CLAR-DEPLOY-25). Pinning
    # keeps `ruff format --check` reproducible — the project's own pinned-tooling
    # ethos (env_digest) applied to the linter. Bump deliberately + reformat, never float.
    "ruff>=0.15.22,<0.16",
    "mypy>=1.10,<2.4",
    "types-PyYAML",
    "types-requests",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "pre-commit>=3.7",
    # CLAR-DEPLOY-21: CI-side AWS emulation — moto is an in-process pip dep (no
    # docker service). It emulates API mechanics ONLY; it does NOT evaluate IAM
    # session policies, S3 bucket policies, or KMS key policies, so every
    # policy-enforcement negative stays behind the `aws_live` marker.
    "boto3>=1.34",
    "moto[s3,sqs,kms,secretsmanager,sts]>=5.1,<6.0",
    # starlette 1.x's TestClient emits a StarletteDeprecationWarning under plain
    # httpx, which the repo's pytest `filterwarnings=["error"]` turns fatal;
    # httpx2 (named by starlette's `full` extra) makes the import warning-clean.
    # Mandatory dev pin per CLAR-DEPLOY-19 (test-client only, never production).
    "httpx2==2.6.0",
]
# CLAR-DEPLOY-19 (RESOLVED 2026-07-14): the exact-pinned HTTP stack for the
# CP-01 request-lifecycle adapter + ORCH-01 HTTP surface. starlette is pinned
# explicitly because fastapi's starlette bound is uncapped — an unpinned
# resolve would silently drift the security-relevant HTTP parsing layer.
# Revisit at the API container image build (hash-pinned requirements.txt) and
# on any security advisory for starlette/h11/uvicorn.
http = [
    "fastapi==0.138.2",
    "starlette==1.3.1",
    "pydantic==2.13.4",
    "uvicorn==0.51.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "detectors*", "integrations*", "services*", "workers*", "web*", "tools*"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["analysis", "detectors", "integrations", "services", "workers", "web", "tools", "tests"]
# Corpus fixtures are intentionally-malformed sample programs (reflection
# seeds, vuln samples) — test DATA, not code. mypy and detect-secrets already
# exclude tests/corpora/; keep ruff in lockstep so `ruff check .` in the
# pre-push hook does not flag deliberate F821/etc. in the corpora.
extend-exclude = ["tests/corpora"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "S101",   # assert used (tests use assert)
    "S603",   # subprocess call (needed for tool invocations)
    "ANN101", # missing self annotation — deprecated, removed in ruff 0.6+
    "ANN102", # missing cls annotation — deprecated, removed in ruff 0.6+
    "UP042",  # `class X(str, Enum)` over `StrEnum`: several DOC-CMP specs fix the
              # `(str, Enum)` form verbatim (e.g. DOC-CMP-SCM-01 §3.1) because
              # `str()` of a member must stay `ClassName.MEMBER`, not the value;
              # StrEnum would change that wire behaviour. Keep the spec'd form.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"db/migrations/**" = ["N999", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["analysis", "detectors", "integrations", "services", "workers", "web", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
    "db/migrations/",
    "tests/corpora/",
]

[[tool.mypy.overrides]]
module = ["joern.*", "codeql.*", "sarif_om.*"]
ignore_missing_imports = true

# CMP-DEPLOY-03 (observability): the OpenTelemetry SDK + AWS exporters are an
# optional, lazily-imported dependency (imported only inside init_otel on the
# success path, never at module top-level), so the hermetic AC-DEPLOY-03b slice
# needs no opentelemetry-* install. mypy has no stubs for it; ignore the missing
# import rather than gate the strict type check on a heavy optional dep.
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

# CLAR-DEPLOY-21: boto3/botocore/moto are dev-extra deps for the AWS-emulation
# test slice; boto3 is lazily imported inside S3ObjectStore.__init__ (only on
# the client=None production path), so hermetic runs need no boto3 install.
# No stubs are shipped; ignore like the opentelemetry.* override above.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto.*"]
ignore_missing_imports = true

# CMP-ORCH-01 Track 1D (services/scan/sql_adapters.py): psycopg2-binary is a
# `dev`-extra dep (no bundled type stubs) and is imported lazily inside
# psycopg2_connection_factory (only on the real-DB path), mirroring the
# boto3/opentelemetry overrides above — hermetic unit runs need no psycopg2
# install.
[[tool.mypy.overrides]]
module = ["psycopg2.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    # tests/corpora holds corpus DATA + each corpus's own build-pipeline
    # self-tests (validated at corpus-build time, not platform unit tests).
    # They use duplicate basenames (multiple test_pipeline.py) and cwd-relative
    # paths, so collecting them in the platform `pytest tests/` run (pre-push,
    # ad-hoc) breaks on import-file-mismatch once 2+ corpora coexist. CI's unit
    # job already scopes to tests/unit/ and no workflow runs corpus pytest, so
    # exclude them globally here (coverage already omits */corpora/*).
    "--ignore=tests/corpora",
]
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: integration tests (real components, slower)",
    "falsifier: adversarial falsifier campaigns (Gate 2/4 release blockers)",
    "empirical: empirical benchmark tests",
    "invariant: invariant verification tests (TST-INV-*)",
    "nightly: run only in nightly CI",
    "pre_release: run only before release tags",
    "aws_live: policy-enforcement negatives against the live AWS account; opt-in via SCANIPY_AWS_LIVE_TESTS=1 (never runs on PR CI)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["analysis", "detectors", "integrations", "services", "tools"]
omit = ["*/migrations/*", "*/corpora/*", "tests/*"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
