[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanipy"
version = "3.2.0"
description = "Multi-tenant SaaS SAST platform — deterministic taint analysis via IFDS/IDE"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    # CMP-FND-03 signs provenance records via KMS and verifies RSASSA-PSS
    # signatures locally (AC-FND-03a: verify without re-running analysis).
    # The verifier in services/scan/provenance uses cryptography; declare it so
    # CI's lint (mypy-strict) and test jobs install it rather than relying on a
    # transitive presence that does not exist.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4.10",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "detectors*", "integrations*", "services*", "workers*", "web*"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["analysis", "detectors", "integrations", "services", "workers", "web", "tests"]
# Corpus fixtures are intentionally-malformed sample programs (reflection
# seeds, vuln samples) — test DATA, not code. mypy and detect-secrets already
# exclude tests/corpora/; keep ruff in lockstep so `ruff check .` in the
# pre-push hook does not flag deliberate F821/etc. in the corpora.
extend-exclude = ["tests/corpora"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "S101",   # assert used (tests use assert)
    "S603",   # subprocess call (needed for tool invocations)
    "ANN101", # missing self annotation — deprecated, removed in ruff 0.6+
    "ANN102", # missing cls annotation — deprecated, removed in ruff 0.6+
    "UP042",  # `class X(str, Enum)` over `StrEnum`: several DOC-CMP specs fix the
              # `(str, Enum)` form verbatim (e.g. DOC-CMP-SCM-01 §3.1) because
              # `str()` of a member must stay `ClassName.MEMBER`, not the value;
              # StrEnum would change that wire behaviour. Keep the spec'd form.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"db/migrations/**" = ["N999", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["analysis", "detectors", "integrations", "services", "workers", "web"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
    "db/migrations/",
    "tests/corpora/",
]

[[tool.mypy.overrides]]
module = ["joern.*", "codeql.*", "sarif_om.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
    # tests/corpora holds corpus DATA + each corpus's own build-pipeline
    # self-tests (validated at corpus-build time, not platform unit tests).
    # They use duplicate basenames (multiple test_pipeline.py) and cwd-relative
    # paths, so collecting them in the platform `pytest tests/` run (pre-push,
    # ad-hoc) breaks on import-file-mismatch once 2+ corpora coexist. CI's unit
    # job already scopes to tests/unit/ and no workflow runs corpus pytest, so
    # exclude them globally here (coverage already omits */corpora/*).
    "--ignore=tests/corpora",
]
markers = [
    "unit: unit tests (fast, no I/O)",
    "integration: integration tests (real components, slower)",
    "falsifier: adversarial falsifier campaigns (Gate 2/4 release blockers)",
    "empirical: empirical benchmark tests",
    "invariant: invariant verification tests (TST-INV-*)",
    "nightly: run only in nightly CI",
    "pre_release: run only before release tags",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["analysis", "detectors", "integrations", "services"]
omit = ["*/migrations/*", "*/corpora/*", "tests/*"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
