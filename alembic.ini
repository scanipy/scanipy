# Alembic configuration for Scanipy v3.2 — CMP-CP-03 tenancy schema.
#
# Substrate: PostgreSQL 16 on Amazon RDS (CLAR-DEPLOY-03).
# The runtime database URL is NOT hard-coded here; db/migrations/env.py reads it
# from the SCANIPY_DATABASE_URL environment variable so that the same migration
# set runs unchanged against the CI Postgres service, staging, and production
# (each with a distinct, secret-injected URL — DOC-DB §2 production gates).

[alembic]
script_location = db/migrations
version_path_separator = os
# Migration file naming: <YYYYMMDD>_<NNNN>_<slug>.py (DOC-DB §2).
# Authored by hand to keep the topological order explicit; autogenerate is not used.
prepend_sys_path = .

# sqlalchemy.url is intentionally left blank — env.py injects it from
# SCANIPY_DATABASE_URL at runtime. A literal URL here would be an unpinned-env
# foot-gun (INV-2 spirit) and would leak across environments.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
