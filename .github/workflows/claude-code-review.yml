name: Claude Code Review

on:
  pull_request:
    # No `synchronize` — review fires when a PR is opened / marked ready /
    # reopened, not on every push (cost control). Re-review a pushed PR by
    # toggling draft↔ready or with a one-off `@claude review` comment.
    types: [opened, ready_for_review, reopened]

jobs:
  claude-review:
    # Only run on same-repo PRs — secrets are unavailable to forked PR workflows.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        # Pinned to a SHA (v1.0.133) rather than the floating @v1 tag so the
        # reviewer is reproducible and a future @v1 retag cannot silently change
        # behaviour. Bump deliberately.
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Force tag mode with an action-owned tracking comment. Without this the
          # action ran in prompt/agent mode and relied on the agent itself calling
          # the GitHub comment tool to post the verdict — which intermittently hit
          # permission denials (observed: completes "success" but posts NO verdict
          # on re-triggers; see PR #211). track_progress makes the action own the
          # comment lifecycle so the APPROVE / REQUEST-CHANGES verdict is posted
          # reliably on every run (RULE-10 depends on the posted verdict, not the
          # green check-conclusion).
          track_progress: true
          # This job is the CANONICAL Scanipy v3.2 code reviewer (RULE-10).
          # The former /code-review-cmp Skill is retired; its doctrine lives here.
          prompt: |
            You are the Scanipy v3.2 Code Review Agent — the canonical reviewer for RULE-10.
            First read: CLAUDE.md, .claude/rules/00-global.md, .claude/rules/01-invariants.md,
            .claude/rules/02-provenance.md, and .github/PULL_REQUEST_TEMPLATE.md.

            Then run /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            and additionally verify, posting all findings as a PR comment with a severity tag each:
            - INV-1..6 compliance (.claude/rules/01-invariants.md).
            - RULE-4: unspecified behaviour is filed as CLAR-* in WBS.md §17, never designed inline.
            - RULE-6: every finding-emitting path threads origin, S_version, env_digest, and
              cpg_order_hash with its "canonical iff fingerprint_class = strong" annotation.
            - PLAN.md / SDD.md untouched; WBS.md changes limited to status flips / §17 / §18.
            - The PR-template checklist is satisfied.
            End with an explicit verdict: APPROVE or REQUEST-CHANGES.
