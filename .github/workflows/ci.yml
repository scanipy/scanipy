name: CI — Scanipy v3.2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR / feature-branch runs when a developer pushes
# again before the previous run finishes. `main` (push to default
# branch) is kept sacred — its runs deploy nothing today but will once
# CMP-DEPLOY-* lands, and cancelling a main run mid-attestor would
# leave a half-recorded determinism partition. Pattern lifted from
# Zeus .gitlab-ci.yml workflow:auto_cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Lint and type check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy strict
        run: |
          # Type-check only the source dirs that actually contain .py files.
          # A per-component branch contains only a subset of these dirs; handing
          # mypy a dir that is absent or empty makes it error ("Duplicate module
          # __main__" / "no .py files in directory"). Build the list dynamically
          # so the job matches the resilient pre-push hook and stays green during
          # incremental Phase-2 landings.
          DIRS=""
          for d in analysis detectors integrations services workers; do
            if find "$d" -name "*.py" 2>/dev/null | grep -q .; then DIRS="$DIRS $d"; fi
          done
          if [ -n "$DIRS" ]; then
            echo "mypy on:$DIRS"
            mypy --config-file pyproject.toml $DIRS
          else
            echo "No Python source files yet — mypy skipped (scaffold phase)"
          fi

      # Node toolchain is needed only once the web/ dashboard (CMP-CP-04)
      # has source files. Gate every Node step on web/ existence so the
      # lint job stays green during the scaffold phase. Same pattern as
      # the Mypy scaffold-phase guard above.
      #
      # `cache: npm` is intentionally omitted: actions/setup-node@v4
      # errors out when cache:npm is set but no package-lock.json /
      # npm-shrinkwrap.json / yarn.lock exists. Re-enable once the
      # first lockfile is committed; switch `npm install` back to
      # `npm ci` at the same time for deterministic installs (Renovate
      # will keep the lockfile fresh per the LLM-SDK and post-1.0
      # rules in renovate.json).
      - uses: actions/setup-node@v4
        if: hashFiles('web/**/*.{ts,tsx,js,jsx}') != ''
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node dependencies
        if: hashFiles('web/**/*.{ts,tsx,js,jsx}') != ''
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: ESLint
        if: hashFiles('web/**/*.{ts,tsx,js,jsx}') != ''
        run: npm run lint

      - name: Prettier check
        if: hashFiles('web/**/*.{ts,tsx,js,jsx}') != ''
        run: npm run format:check

      - name: Node toolchain — skipped (scaffold phase, no web/ source yet)
        if: hashFiles('web/**/*.{ts,tsx,js,jsx}') == ''
        run: echo "web/ has no TS/JS source yet — Node setup + ESLint + Prettier skipped."

  # ---------------------------------------------------------------------------
  # Unit tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        # Selector is `unit or invariant`: the no-DB `TST-INV-*` / invariant
        # specs are authored as hard "every CI run" gates but carry the
        # `invariant` marker (not `unit`), so `-m unit` alone never collected
        # them (CLAR-CI-01, WBS §17). The DB-backed invariant falsifiers carry
        # `integration` and run in the integration-tests job instead.
        #
        # CMP-CI-01 staging-table DRIFT GUARD rides this job: the
        # `@pytest.mark.unit` test in tests/unit/test_staging_status_table.py
        # FAILS if the committed docs/cross-cutting/DOC-STAGING-STATUS.md has
        # drifted from a regeneration (it stops the AC-driven table from rotting
        # back into hand-edited prose — WBS §21-L9). It is a developer-experience
        # quality bar carried HERE, NOT a fifth Gate-class check (DOC-CMP-CI-01
        # §7.1 forbids a fifth gate without an SDD AC); it is never a release
        # blocker, just a loud red unit test like any other.
        #
        # `coverage.fail_under = 80` in pyproject.toml is the production
        # contract. During the scaffold phase, no application source
        # exists yet (analysis/, detectors/, integrations/, services/,
        # workers/ are all empty), so total coverage of zero would
        # tank the job. Detect that state and pass --cov-fail-under=0
        # to override the pyproject threshold for this run only. The
        # override drops the moment the first .py source file lands.
        # Same scaffold-phase guard pattern as the Mypy + Node steps
        # in the lint job above.
        run: |
          if find analysis detectors integrations services workers -name "*.py" 2>/dev/null | grep -q .; then
            pytest tests/unit/ -m "unit or invariant" -q --tb=short --cov=. --cov-report=xml
          else
            echo "Scaffold phase — no application source yet; coverage gate temporarily disabled (will re-enable at fail_under=80 from pyproject.toml once source lands)."
            pytest tests/unit/ -m "unit or invariant" -q --tb=short --cov=. --cov-report=xml --cov-fail-under=0
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: hashFiles('coverage.xml') != ''
        with:
          name: coverage-unit
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Gate 1 — DSL distributivity proofs (required status check, every PR)
  # AC-DET-01a: combinator DSL closure check
  # ---------------------------------------------------------------------------
  dsl-proofs:
    name: "Gate 1 — DSL proofs (AC-DET-01a)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run DSL proof tests
        run: pytest tests/unit/test_dsl_proofs.py -m unit -q --tb=short -v

  # ---------------------------------------------------------------------------
  # Gate 4 — e-process martingale unit tests (pre-customer-enablement)
  # AC-TRI-02b: anytime-valid martingale precision-floor gate
  # ---------------------------------------------------------------------------
  eprocess-unit:
    name: "Gate 4 — e-process martingale (AC-TRI-02b)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run e-process martingale tests
        # CMP-TRI-02 will populate tests/falsifier/eprocess/ with
        # TST-AC-TRI-02b (martingale property tests). Until then the
        # directory has only __init__.py and pytest exits 5 ("no tests
        # collected") which CI counts as a failure. Skip cleanly with
        # a visible message until the first test_*.py lands here; at
        # that point the guard auto-flips and Gate 4 becomes enforced.
        #
        # CMP-DEPLOY-03 §3.4 metric 10 (CLAR-DEPLOY-20): every Gate-4 run
        # publishes the eprocess.martingale_test_status gauge (1 green /
        # 0 failing) via scripts/publish_gate4_status.py. Publishing is
        # NON-GATING (|| echo): the gate verdict is the pytest exit code,
        # re-asserted after the publish. The publisher is a hermetic no-op
        # here unless SCANIPY_METRICS_CW_DIRECT=1 + AWS creds are wired.
        run: |
          if find tests/falsifier/eprocess/ -name 'test_*.py' 2>/dev/null | grep -q .; then
            if pytest tests/falsifier/eprocess/ -q --tb=short -v; then
              gate4_status=1
            else
              gate4_status=0
            fi
            python scripts/publish_gate4_status.py --status "$gate4_status" \
              || echo "Gate-4 status publish failed (non-gating)"
            [ "$gate4_status" = "1" ] || exit 1
          else
            echo "Scaffold phase — no TST-AC-TRI-02b tests in tests/falsifier/eprocess/ yet (CMP-TRI-02 not implemented). Gate 4 will enforce once tests land."
          fi

  # ---------------------------------------------------------------------------
  # Integration tests (non-gating, informational)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [unit-tests, dsl-proofs]
    if: github.event_name == 'push' || github.base_ref == 'main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scanipy_test
          POSTGRES_USER: scanipy
          POSTGRES_PASSWORD: scanipy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCANIPY_DATABASE_URL: postgresql://scanipy:scanipy_test@localhost:5432/scanipy_test
      SCANIPY_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        # Same scaffold-phase guard as the e-process gate above:
        # tests/integration/ only has __init__.py today, so pytest
        # would exit 5 ("no tests collected"). Re-enforces the moment
        # the first integration test lands.
        run: |
          if find tests/integration/ -name 'test_*.py' 2>/dev/null | grep -q .; then
            pytest tests/integration/ -m integration -q --tb=short
          else
            echo "Scaffold phase — no integration tests in tests/integration/ yet. Job will enforce once tests land."
          fi
