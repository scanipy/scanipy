name: CI — Scanipy v3.2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR / feature-branch runs when a developer pushes
# again before the previous run finishes. `main` (push to default
# branch) is kept sacred — its runs deploy nothing today but will once
# CMP-DEPLOY-* lands, and cancelling a main run mid-attestor would
# leave a half-recorded determinism partition. Pattern lifted from
# Zeus .gitlab-ci.yml workflow:auto_cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Lint and type check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dev dependencies
        # dev,http: the CLAR-DEPLOY-19 pinned HTTP stack (fastapi/starlette/
        # pydantic/uvicorn) is typechecked + unit-tested every run.
        run: pip install -e ".[dev,http]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Fetch origin/main (env_digest registry base-ref comparisons)
        if: github.event_name == 'pull_request'
        run: git fetch origin main --depth=1

      - name: env_digest registry validity (CLAR-DEPLOY-22)
        run: >-
          python scripts/check_env_digest_registry.py
          ${{ github.event_name == 'pull_request' && '--base-ref origin/main' || '' }}

      - name: env_digest rollover-ceremony lint (AC-DEPLOY-04a / DOC-CMP-DEPLOY-02 §6.2)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_rollover_ceremony.py --base-ref origin/main --title "${PR_TITLE}"

      - name: Mypy strict
        run: |
          # Match pre-push: include worker tooling, skip only absent/empty roots,
          # and fail on discovery errors instead of treating them as scaffolds.
          set -e
          set --
          for source_dir in analysis detectors integrations services workers tools; do
            [ -d "$source_dir" ] || continue
            first_python=$(find "$source_dir" -name '*.py' -print -quit)
            if [ -n "$first_python" ]; then
              set -- "$@" "$source_dir"
            fi
          done
          if [ "$#" -gt 0 ]; then
            mypy --config-file pyproject.toml "$@"
          else
            echo "No Python source files yet — mypy skipped (scaffold phase)"
          fi

      # Node toolchain is needed only once the web/ dashboard (CMP-CP-04)
      # has source files. Gate every Node step on web/ existence so the
      # lint job stays green during the scaffold phase. Same pattern as
      # the Mypy scaffold-phase guard above.
      #
      # `cache: npm` is intentionally omitted: actions/setup-node@v4
      # errors out when cache:npm is set but no package-lock.json /
      # npm-shrinkwrap.json / yarn.lock exists. Re-enable once the
      # first lockfile is committed; switch `npm install` back to
      # `npm ci` at the same time for deterministic installs (Renovate
      # will keep the lockfile fresh per the LLM-SDK and post-1.0
      # rules in renovate.json).
      - uses: actions/setup-node@v4
        if: hashFiles('web/**/*.{ts,tsx,js,jsx}') != ''
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node dependencies
        if: hashFiles('web/**/*.{ts,tsx,js,jsx}') != ''
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: ESLint
        if: hashFiles('web/**/*.{ts,tsx,js,jsx}') != ''
        run: npm run lint

      - name: Prettier check
        if: hashFiles('web/**/*.{ts,tsx,js,jsx}') != ''
        run: npm run format:check

      - name: Node toolchain — skipped (scaffold phase, no web/ source yet)
        if: hashFiles('web/**/*.{ts,tsx,js,jsx}') == ''
        run: echo "web/ has no TS/JS source yet — Node setup + ESLint + Prettier skipped."

  # ---------------------------------------------------------------------------
  # Unit tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        # dev,http: the CLAR-DEPLOY-19 pinned HTTP stack — the DEPLOY-19 adapter
        # unit suite (tests/unit/test_deploy19_http_adapter.py) needs it.
        run: pip install -e ".[dev,http]"

      - name: Run unit tests
        # Selector is `unit or invariant`: the no-DB `TST-INV-*` / invariant
        # specs are authored as hard "every CI run" gates but carry the
        # `invariant` marker (not `unit`), so `-m unit` alone never collected
        # them (CLAR-CI-01, WBS §17). The DB-backed invariant falsifiers carry
        # `integration` and run in the integration-tests job instead.
        #
        # CMP-CI-01 staging-table DRIFT GUARD rides this job: the
        # `@pytest.mark.unit` test in tests/unit/test_staging_status_table.py
        # FAILS if the committed docs/cross-cutting/DOC-STAGING-STATUS.md has
        # drifted from a regeneration (it stops the AC-driven table from rotting
        # back into hand-edited prose — WBS §21-L9). It is a developer-experience
        # quality bar carried HERE, NOT a fifth Gate-class check (DOC-CMP-CI-01
        # §7.1 forbids a fifth gate without an SDD AC); it is never a release
        # blocker, just a loud red unit test like any other.
        #
        # `coverage.fail_under = 80` in pyproject.toml is the production
        # contract. During the scaffold phase, no application source
        # exists yet (analysis/, detectors/, integrations/, services/,
        # workers/ are all empty), so total coverage of zero would
        # tank the job. Detect that state and pass --cov-fail-under=0
        # to override the pyproject threshold for this run only. The
        # override drops the moment the first .py source file lands.
        # Same scaffold-phase guard pattern as the Mypy + Node steps
        # in the lint job above.
        run: |
          if find analysis detectors integrations services workers -name "*.py" 2>/dev/null | grep -q .; then
            pytest tests/unit/ -m "unit or invariant" -q --tb=short --cov=. --cov-report=xml
          else
            echo "Scaffold phase — no application source yet; coverage gate temporarily disabled (will re-enable at fail_under=80 from pyproject.toml once source lands)."
            pytest tests/unit/ -m "unit or invariant" -q --tb=short --cov=. --cov-report=xml --cov-fail-under=0
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: hashFiles('coverage.xml') != ''
        with:
          name: coverage-unit
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Gate 1 — DSL distributivity proofs (required status check, every PR)
  # AC-DET-01a: combinator DSL closure check
  # ---------------------------------------------------------------------------
  dsl-proofs:
    name: "Gate 1 — DSL proofs (AC-DET-01a)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run DSL proof tests
        run: pytest tests/unit/test_dsl_proofs.py -m unit -q --tb=short -v

  # ---------------------------------------------------------------------------
  # Gate 4 — e-process martingale unit tests (pre-customer-enablement)
  # AC-TRI-02b: anytime-valid martingale precision-floor gate
  # ---------------------------------------------------------------------------
  eprocess-unit:
    name: "Gate 4 — e-process martingale (AC-TRI-02b)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run e-process martingale tests
        # CMP-TRI-02 will populate tests/falsifier/eprocess/ with
        # TST-AC-TRI-02b (martingale property tests). Until then the
        # directory has only __init__.py and pytest exits 5 ("no tests
        # collected") which CI counts as a failure. Skip cleanly with
        # a visible message until the first test_*.py lands here; at
        # that point the guard auto-flips and Gate 4 becomes enforced.
        #
        # CMP-DEPLOY-03 §3.4 metric 10 (CLAR-DEPLOY-20): every Gate-4 run
        # publishes the eprocess.martingale_test_status gauge (1 green /
        # 0 failing) via scripts/publish_gate4_status.py. Publishing is
        # NON-GATING (|| echo): the gate verdict is the pytest exit code,
        # re-asserted after the publish. The publisher is a hermetic no-op
        # here unless SCANIPY_METRICS_CW_DIRECT=1 + AWS creds are wired.
        run: |
          if find tests/falsifier/eprocess/ -name 'test_*.py' 2>/dev/null | grep -q .; then
            if pytest tests/falsifier/eprocess/ -q --tb=short -v; then
              gate4_status=1
            else
              gate4_status=0
            fi
            python scripts/publish_gate4_status.py --status "$gate4_status" \
              || echo "Gate-4 status publish failed (non-gating)"
            [ "$gate4_status" = "1" ] || exit 1
          else
            echo "Scaffold phase — no TST-AC-TRI-02b tests in tests/falsifier/eprocess/ yet (CMP-TRI-02 not implemented). Gate 4 will enforce once tests land."
          fi

  # ---------------------------------------------------------------------------
  # Integration tests (non-gating, informational)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [unit-tests, dsl-proofs]
    if: github.event_name == 'push' || github.base_ref == 'main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scanipy_test
          POSTGRES_USER: scanipy
          POSTGRES_PASSWORD: scanipy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCANIPY_DATABASE_URL: postgresql://scanipy:scanipy_test@localhost:5432/scanipy_test
      SCANIPY_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        # Same scaffold-phase guard as the e-process gate above:
        # tests/integration/ only has __init__.py today, so pytest
        # would exit 5 ("no tests collected"). Re-enforces the moment
        # the first integration test lands.
        run: |
          if find tests/integration/ -name 'test_*.py' 2>/dev/null | grep -q .; then
            pytest tests/integration/ -m integration -q --tb=short
          else
            echo "Scaffold phase — no integration tests in tests/integration/ yet. Job will enforce once tests land."
          fi

  # Reserved execution roles are cluster-global. Never share this service with
  # legacy integration tests or discover an application database URL.
  occurrence-store-tests:
    name: Occurrence store — restricted roles and concurrency
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      occurrence-postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: occurrence_bootstrap
          POSTGRES_USER: occurrence_admin
          # Public, disposable CI fixture password; never a deployed credential.
          POSTGRES_PASSWORD: occurrence_test # pragma: allowlist secret
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U occurrence_admin -d occurrence_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory 1536m
          --memory-swap 1536m
          --cpus 2
          --pids-limit 256
          --shm-size 128m
          --tmpfs /var/lib/postgresql/data:rw,size=1073741824,mode=0700
    env:
      # Explicit disposable-test opt-in, not SCANIPY_DATABASE_URL.
      SCANIPY_OCCURRENCE_TEST_URL: postgresql://occurrence_admin:occurrence_test@localhost:5432/occurrence_bootstrap # pragma: allowlist secret
      SCANIPY_OCCURRENCE_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,http]"

      - name: Run real PostgreSQL occurrence-store tests
        run: >-
          pytest tests/integration/test_occurrence_store.py -m integration
          -q --tb=short --junitxml=occurrence-store-junit.xml

      - name: Require actual execution without skips
        run: |
          python - <<'PY'
          from xml.etree import ElementTree

          root = ElementTree.parse("occurrence-store-junit.xml").getroot()
          cases = root.findall(".//testcase")
          if not cases or any(case.find(tag) is not None
                              for case in cases
                              for tag in ("skipped", "failure", "error")):
              raise SystemExit("Occurrence-store acceptance requires passing, non-skipped tests")
          print(f"Verified {len(cases)} executed occurrence-store test cases; no skips")
          PY

      - name: Retain database-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occurrence-store-junit
          path: occurrence-store-junit.xml
          if-no-files-found: error

  # Separate job/runner/service: reserved roles are cluster-global. This hosted
  # loopback TCP fixture is not the local network-none Unix-socket environment.
  accepted-ledger-tests:
    name: Accepted ledger — restricted roles and replay
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      accepted-postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: al03_bootstrap
          POSTGRES_USER: al03_admin
          # Public disposable CI literal, never an installed/deployed credential.
          POSTGRES_PASSWORD: accepted_ledger_test # pragma: allowlist secret
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U al03_admin -d al03_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --memory 4294967296
          --memory-swap 4294967296
          --cpus 2
          --pids-limit 256
          --shm-size 134217728
          --tmpfs /var/lib/postgresql/data:rw,nosuid,nodev,noexec,size=3221225472,mode=0700
    env:
      SCANIPY_ACCEPTED_LEDGER_TEST_URL: # pragma: allowlist secret
        postgresql://al03_admin:accepted_ledger_test@127.0.0.1:5432/al03_bootstrap
      SCANIPY_ACCEPTED_LEDGER_TEST_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,http]"

      - name: Run AL tests and compare the actual dedicated-cluster baseline
        shell: bash
        run: |
          # Pass only fixed test routing plus the selected interpreter/source.
          # All ambient app/occurrence/PG/AWS/pytest/bypass variables disappear.
          env -i PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE" \
            PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            SCANIPY_ACCEPTED_LEDGER_TEST_URL="$SCANIPY_ACCEPTED_LEDGER_TEST_URL" \
            SCANIPY_ACCEPTED_LEDGER_TEST_REQUIRED=1 python -B - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          import psycopg2

          # One statement/connection before tests, one after their teardown.
          # Each relation has a 64-row cap plus one overflow sentinel; there is
          # no unbounded array aggregation, role adoption or cleanup mutation.
          QUERY = """
          WITH databases AS MATERIALIZED (
            SELECT datname::text AS name, oid::text AS id, datdba::text AS owner
            FROM pg_database ORDER BY datname::text COLLATE "C" LIMIT 65
          ), roles AS MATERIALIZED (
            SELECT rolname::text AS name, oid::text AS id, rolsuper, rolinherit,
              rolcreaterole, rolcreatedb, rolcanlogin, rolreplication, rolbypassrls
            FROM pg_roles ORDER BY rolname::text COLLATE "C" LIMIT 65
          ), clients AS MATERIALIZED (
            SELECT pid FROM pg_stat_activity
            WHERE backend_type='client backend' AND pid<>pg_backend_pid()
            ORDER BY pid LIMIT 65
          )
          SELECT json_build_object(
            'databases', (SELECT coalesce(json_agg(json_build_array(name,id,owner)
              ORDER BY name COLLATE "C"),'[]'::json) FROM databases),
            'roles', (SELECT coalesce(json_agg(json_build_array(name,id,rolsuper,
              rolinherit,rolcreaterole,rolcreatedb,rolcanlogin,rolreplication,
              rolbypassrls) ORDER BY name COLLATE "C"),'[]'::json) FROM roles),
            'other_clients', (SELECT coalesce(json_agg(pid::text ORDER BY pid),
              '[]'::json) FROM clients)
          )::text
          """

          def require(condition, message):
              if not condition:
                  raise AssertionError(message)

          def catalog_shape(value):
              require(type(value) is dict and set(value) == {
                  "databases", "roles", "other_clients"
              }, "catalog schema mismatch")
              for group in value.values():
                  require(type(group) is list and len(group) <= 65,
                          "catalog result exceeded bounded snapshot")
              for row in value["databases"]:
                  require(type(row) is list and len(row) == 3 and
                          all(type(item) is str and len(item) <= 63 for item in row),
                          "database snapshot shape mismatch")
                  require(all(item.isascii() and item.isdecimal() for item in row[1:]),
                          "database OID snapshot mismatch")
              for row in value["roles"]:
                  require(type(row) is list and len(row) == 9 and
                          all(type(item) is str and len(item) <= 63 for item in row[:2]) and
                          all(type(item) is bool for item in row[2:]),
                          "role snapshot shape mismatch")
                  require(row[1].isascii() and row[1].isdecimal(),
                          "role OID snapshot mismatch")
              require(all(type(pid) is str and len(pid) <= 10 and pid.isascii() and
                          pid.isdecimal() for pid in value["other_clients"]),
                      "client snapshot shape mismatch")

          def snapshot():
              connection = psycopg2.connect(
                  os.environ["SCANIPY_ACCEPTED_LEDGER_TEST_URL"],
                  connect_timeout=2,
                  application_name="scanipy-al-ci-catalog",
                  options="-c default_transaction_read_only=on "
                          "-c statement_timeout=5000 -c lock_timeout=2000",
              )
              try:
                  connection.autocommit = True
                  cursor = connection.cursor()
                  try:
                      cursor.execute(QUERY)
                      rows = cursor.fetchmany(2)
                      require(len(rows) == 1 and type(rows[0]) is tuple and
                              len(rows[0]) == 1 and type(rows[0][0]) is str and
                              len(rows[0][0]) <= 65536,
                              "catalog returned unexpected rows or bytes")
                      value = json.loads(rows[0][0])
                      catalog_shape(value)
                      return value
                  finally:
                      cursor.close()
              finally:
                  # No connection-context commit, close retry or compensating SQL.
                  connection.close()

          def retain(path, value):
              raw = json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n"
              require(len(raw.encode("utf-8")) <= 65536, "catalog artifact too large")
              with path.open("x", encoding="utf-8") as output:
                  output.write(raw)

          def baseline_guard(value):
              catalog_shape(value)
              require(all(len(group) <= 64 for group in value.values()),
                      "catalog census overflow")
              require(value["other_clients"] == [], "dedicated cluster has other clients")
              databases = value["databases"]
              require(len(databases) == 4 and {row[0] for row in databases} == {
                  "al03_bootstrap", "postgres", "template0", "template1"
              }, "unexpected dedicated bootstrap databases")
              users = [row for row in value["roles"] if not row[0].startswith("pg_")]
              require(len(users) == 1 and users[0][0] == "al03_admin" and
                      users[0][2] and users[0][6], "unexpected dedicated bootstrap roles")
              require(all(row[2] == users[0][1] for row in databases),
                      "bootstrap database owners differ")

          before_path = Path("accepted-ledger-catalog-before.json")
          after_path = Path("accepted-ledger-catalog-after.json")
          report_path = Path("accepted-ledger-junit.xml")
          require(not any(path.exists() for path in (before_path, after_path, report_path)),
                  "refusing stale CI evidence")
          before = snapshot()
          retain(before_path, before)
          baseline_guard(before)
          try:
              result = subprocess.run([
                  sys.executable, "-B", "-m", "pytest", "-c", "pyproject.toml",
                  "tests/integration/test_accepted_ledger_sql.py",
                  "tests/integration/test_accepted_ledger_security.py",
                  "tests/integration/test_accepted_historical_reads.py",
                  "tests/integration/test_execution_authority_role.py",
                  "-m", "integration", "-x", "-q", "--tb=short",
                  "--junitxml=accepted-ledger-junit.xml",
              ], check=False)
              print(f"AL pytest exit status: {result.returncode}", flush=True)
          finally:
              after = snapshot()
              retain(after_path, after)
              baseline_guard(after)
              require(after == before, "dedicated catalog differs after AL teardown")
          raise SystemExit(result.returncode)
          PY

      - name: Require exactly 246 successful executed AL cases
        if: always()
        shell: bash
        run: |
          env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 python -B - <<'PY'
          from collections import Counter
          from pathlib import Path
          from xml.etree import ElementTree

          def validate_report(data):
              if type(data) is not bytes or len(data) > 4194304:
                  raise AssertionError("AL report missing or exceeds 4 MiB")
              root = ElementTree.fromstring(data)
              if root.tag not in ("testsuites", "testsuite"):
                  raise AssertionError("AL report is not a recognized JUnit root")
              suites = list(root.iter("testsuite"))
              if len(suites) != 1:
                  raise AssertionError("AL single invocation requires exactly one testsuite")
              suite = suites[0]
              cases = list(suite.iter("testcase"))
              if cases != list(root.iter("testcase")):
                  raise AssertionError("AL testcase lies outside its declared testsuite")
              if suite.get("tests") != str(len(cases)):
                  raise AssertionError("AL suite declared tests count does not match its cases")
              expected = {
                  "tests.integration.test_accepted_ledger_sql": 43,
                  "tests.integration.test_accepted_ledger_security": 102,
                  "tests.integration.test_accepted_historical_reads": 38,
                  "tests.integration.test_execution_authority_role": 63,
              }
              if len(cases) != 246 or Counter(case.get("classname") for case in cases) != expected:
                  raise AssertionError("AL requires exactly 43 SQL, 102 security, "
                                       "38 historical and 63 reader-role cases")
              if any(not case.get("name") for case in cases):
                  raise AssertionError("AL report lacks an exact test identity")
              if len({(case.get("classname"), case.get("name")) for case in cases}) != 246:
                  raise AssertionError("AL report contains duplicate test identities")
              if any(case.find(tag) is not None for case in cases
                     for tag in ("skipped", "failure", "error")):
                  raise AssertionError("AL acceptance requires no skips, failures or errors")
              if any(int(suite.get(tag, "-1")) != 0 for tag in ("skipped", "failures", "errors")):
                  raise AssertionError("AL suite reports a skip, failure or error")

          with Path("accepted-ledger-junit.xml").open("rb") as stream:
              raw = stream.read(4194305)
          validate_report(raw)
          print("Verified 246 executed AL cases: 43 SQL + 102 security + 38 historical "
                "+ 63 reader-role; no skips or errors")
          PY

      - name: Retain AL test and bounded catalog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accepted-ledger-junit-and-catalog
          path: |
            accepted-ledger-junit.xml
            accepted-ledger-catalog-before.json
            accepted-ledger-catalog-after.json
          if-no-files-found: error
