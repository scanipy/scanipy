name: CI — Scanipy v3.2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR / feature-branch runs when a developer pushes
# again before the previous run finishes. `main` (push to default
# branch) is kept sacred — its runs deploy nothing today but will once
# CMP-DEPLOY-* lands, and cancelling a main run mid-attestor would
# leave a half-recorded determinism partition. Pattern lifted from
# Zeus .gitlab-ci.yml workflow:auto_cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Lint and type check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy strict
        run: |
          # Only run mypy if Python source directories exist (scaffold phase: skip gracefully)
          if find analysis detectors integrations services -name "*.py" 2>/dev/null | grep -q .; then
            mypy --config-file pyproject.toml analysis/ detectors/ integrations/ services/
          else
            echo "No Python source files yet — mypy skipped (scaffold phase)"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint
        if: hashFiles('web/**/*.ts') != ''

      - name: Prettier check
        run: npm run format:check
        if: hashFiles('web/**/*.ts') != ''

  # ---------------------------------------------------------------------------
  # Unit tests
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -m unit -q --tb=short --cov=. --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Gate 1 — DSL distributivity proofs (required status check, every PR)
  # AC-DET-01a: combinator DSL closure check
  # ---------------------------------------------------------------------------
  dsl-proofs:
    name: "Gate 1 — DSL proofs (AC-DET-01a)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run DSL proof tests
        run: pytest tests/unit/test_dsl_proofs.py -m unit -q --tb=short -v

  # ---------------------------------------------------------------------------
  # Gate 4 — e-process martingale unit tests (pre-customer-enablement)
  # AC-TRI-02b: anytime-valid martingale precision-floor gate
  # ---------------------------------------------------------------------------
  eprocess-unit:
    name: "Gate 4 — e-process martingale (AC-TRI-02b)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run e-process martingale tests
        run: pytest tests/falsifier/eprocess/ -q --tb=short -v

  # ---------------------------------------------------------------------------
  # Integration tests (non-gating, informational)
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [unit-tests, dsl-proofs]
    if: github.event_name == 'push' || github.base_ref == 'main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scanipy_test
          POSTGRES_USER: scanipy
          POSTGRES_PASSWORD: scanipy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCANIPY_DATABASE_URL: postgresql://scanipy:scanipy_test@localhost:5432/scanipy_test
      SCANIPY_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run integration tests
        run: pytest tests/integration/ -m integration -q --tb=short
