name: Deploy — ECS Fargate (tagged releases only)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Workflow-level default is the least-privilege floor. Each job below declares
# its own `permissions:` block scoped to exactly what that job needs — a
# job-level block REPLACES this default for that job, it does not add to it.
# (Only `register-env-digest` needs contents:write/pull-requests:write; giving
# that to every job in the workflow would be permission creep.)
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ---------------------------------------------------------------------------
  # Pre-deploy gate checks — all four named gates must pass on this commit SHA.
  # Gates 1/3/4 complete on the push-to-main CI run before the tag is cut.
  # Gate 2 (Falsifier CW) also triggers on this same tag push and runs
  # concurrently. All four use a 20-min wait loop to handle both cases.
  # ---------------------------------------------------------------------------
  pre-deploy-checks:
    name: Pre-deploy gate verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read      # pre-deploy gate verification via Checks API
      actions: write    # workflow_dispatch for Gate 3 (Attestor) on workflow-only tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: needed for the reachable-from-main ancestry check below

      - name: Verify tagged commit is reachable from origin/main and unflagged by the direct-push detector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          git fetch origin main --depth=1000000

          # (1) Reachable-from-main assertion. A release tag may only be cut on a
          # commit that actually landed on main; a tag pushed on some other branch
          # never ran the gate workflows in the first place (the poll loop below
          # would simply time out, but this fails fast with an unambiguous cause).
          if ! git merge-base --is-ancestor "${SHA}" origin/main; then
            echo "ERROR: tagged commit ${SHA} is not reachable from origin/main."
            echo "Release tags may only be cut on commits that landed on main via the PR flow."
            exit 1
          fi
          echo "PASS: ${SHA} is reachable from origin/main."

          # (2) Direct-push-detector assertion. enforce-pr-only-merges.yml posts a
          # red 'Direct-push detector' check-run on any commit pushed to main
          # outside the PR flow (RULE-10) — this is exactly the taint that voided
          # the v0.1.1 env_digest registrations (CLAR-DEPLOY-22: built from
          # direct-push commit d948e6b). A release must never be cut on a commit
          # that check flagged, so it is enforced here as a hard pre-deploy gate,
          # not left as an easy-to-miss red dot elsewhere in the commit's check list.
          result=$(gh api --paginate "repos/${REPO}/commits/${SHA}/check-runs" \
            --jq '.check_runs[] | select(.name == "Direct-push detector") | [.started_at, .conclusion] | @tsv' \
            2>/dev/null | sort -r | head -1 | cut -f2)
          if [ -z "${result}" ]; then
            echo "NOTICE: no 'Direct-push detector' check-run found on ${SHA} —"
            echo "treating as pass; the ancestry check above is the primary guard."
          elif [ "${result}" != "success" ]; then
            echo "ERROR: 'Direct-push detector' check-run conclusion='${result}' on ${SHA}."
            echo "This commit bypassed the PR-only-merge flow (RULE-10) and must not be released."
            exit 1
          else
            echo "PASS: 'Direct-push detector' is success on ${SHA}."
          fi

      - name: Verify all required CI gates passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          # check_gate NAME MAX_WAIT_SECONDS
          # Polls until the named check-run posts a conclusion, then verifies it
          # is "success". A commit can carry more than one check-run of the same
          # name (re-runs); --paginate fetches every page of check-runs and the
          # newest entry is selected deterministically by `started_at` (NOT by
          # `tail -1`, whose order is an API implementation detail, not a
          # recency guarantee).
          check_gate() {
            local check_name="$1"
            local max_wait="$2"
            local elapsed=0
            local result

            while true; do
              result=$(gh api --paginate "repos/${REPO}/commits/${SHA}/check-runs" \
                --jq ".check_runs[] | select(.name == \"${check_name}\") | [.started_at, .conclusion] | @tsv" \
                2>/dev/null | sort -r | head -1 | cut -f2)

              if [ "${result}" = "success" ]; then
                echo "GATE PASS: '${check_name}'"
                return 0
              elif [ -n "${result}" ] && [ "${result}" != "null" ]; then
                echo "GATE FAIL: '${check_name}' conclusion='${result}' on ${SHA}"
                return 1
              fi

              if [ "${elapsed}" -ge "${max_wait}" ]; then
                echo "GATE FAIL: '${check_name}' not found / not complete on ${SHA}"
                return 1
              fi

              echo "Waiting for '${check_name}' … ${elapsed}/${max_wait}s"
              sleep 30
              elapsed=$((elapsed + 30))
            done
          }

          # Gate 3 (Attestor) only auto-triggers when detectors/analysis/workers
          # paths change. For workflow-only tag commits it must be dispatched.
          # Dispatch it now if it has no check run on this SHA yet.
          GATE3_PRESENT=$(gh api --paginate "repos/${REPO}/commits/${SHA}/check-runs" \
            --jq '.check_runs[] | select(.name == "Gate 3 — Attestor core pipeline (AC-CP-05a/c)") | [.started_at, .name] | @tsv' \
            2>/dev/null | sort -r | head -1 | cut -f2)
          if [ -z "${GATE3_PRESENT}" ]; then
            echo "Gate 3 not found on ${SHA} — dispatching attestor workflow on ${{ github.ref_name }}..."
            gh workflow run "Gate 3 — Attestor core (every detector/engine/Env change)" \
              --ref "${{ github.ref_name }}" 2>&1 || \
              echo "::warning::Gate 3 dispatch failed — gate will time-out if attestor.yml has no run on this SHA"
            sleep 15
          fi

          failed=0
          check_gate "Gate 1 — DSL proofs (AC-DET-01a)"                                     1200 || failed=1
          check_gate "Gate 2 — Falsifier CW — zero false negatives (AC-SNAP-03a)"           1200 || failed=1
          check_gate "Gate 3 — Attestor core pipeline (AC-CP-05a/c)"                        1200 || failed=1
          check_gate "Gate 4 — e-process martingale (AC-TRI-02b)"                           1200 || failed=1

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "ERROR: One or more required gates did not pass on ${SHA}."
            echo "Do not deploy until all gates are green."
            exit 1
          fi
          echo "All pre-deploy gates verified green."

  # ---------------------------------------------------------------------------
  # Build and push worker images with digest pinning + Cosign signing
  # ---------------------------------------------------------------------------
  build-images:
    name: Build and sign worker images
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    permissions:
      contents: read
      id-token: write   # OIDC for AWS credential exchange + Cosign keyless signing
    outputs:
      snapshot_digest: ${{ steps.push-snapshot.outputs.digest }}
      detector_digest: ${{ steps.push-detector.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify worker image pins (AC-DEPLOY-02c)
        run: python workers/build/verify_pins.py

      - name: Read tool pins from pins.json
        id: pins
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open("workers/pins.json"))
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"joern_version={d['tools']['joern']['version']}\n")
              f.write(f"joern_sha256={d['tools']['joern']['sha256']}\n")
              f.write(f"codeql_version={d['tools']['codeql']['version']}\n")
              f.write(f"codeql_sha256={d['tools']['codeql']['sha256']}\n")
              f.write(f"git_version={d['tools']['git']['version']}\n")
              f.write(f"git_sha256={d['tools']['git']['sha256']}\n")
              f.write(f"temurin_jre_version={d['tools']['temurin_jre']['version']}\n")
              f.write(f"temurin_jre_sha256={d['tools']['temurin_jre']['sha256']}\n")
          PY

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push snapshot worker
        id: push-snapshot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: workers/snapshot/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/scanipy-snapshot:${{ github.ref_name }}
          build-args: |
            JOERN_VERSION=${{ steps.pins.outputs.joern_version }}
            JOERN_SHA256=${{ steps.pins.outputs.joern_sha256 }}
            CODEQL_VERSION=${{ steps.pins.outputs.codeql_version }}
            CODEQL_SHA256=${{ steps.pins.outputs.codeql_sha256 }}
            GIT_VERSION=${{ steps.pins.outputs.git_version }}
            GIT_SHA256=${{ steps.pins.outputs.git_sha256 }}
            TEMURIN_JRE_VERSION=${{ steps.pins.outputs.temurin_jre_version }}
            TEMURIN_JRE_SHA256=${{ steps.pins.outputs.temurin_jre_sha256 }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push detector worker
        id: push-detector
        uses: docker/build-push-action@v5
        with:
          context: .
          file: workers/detector/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/scanipy-detector:${{ github.ref_name }}
          build-args: |
            JOERN_VERSION=${{ steps.pins.outputs.joern_version }}
            JOERN_SHA256=${{ steps.pins.outputs.joern_sha256 }}
            CODEQL_VERSION=${{ steps.pins.outputs.codeql_version }}
            CODEQL_SHA256=${{ steps.pins.outputs.codeql_sha256 }}
            GIT_VERSION=${{ steps.pins.outputs.git_version }}
            GIT_SHA256=${{ steps.pins.outputs.git_sha256 }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images with Cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            ${{ env.ECR_REGISTRY }}/scanipy-snapshot@${{ steps.push-snapshot.outputs.digest }}
          cosign sign --yes \
            ${{ env.ECR_REGISTRY }}/scanipy-detector@${{ steps.push-detector.outputs.digest }}

      - name: Verify Cosign signatures
        run: |
          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.ECR_REGISTRY }}/scanipy-snapshot@${{ steps.push-snapshot.outputs.digest }}
          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.ECR_REGISTRY }}/scanipy-detector@${{ steps.push-detector.outputs.digest }}

      # --- SLSA-3 provenance attestation (AC-DEPLOY-04c / DOC-CMP-DEPLOY-04 §3.6) --
      # Same predicate builder the hermetic TST-AC-DEPLOY-04c fixture test calls, so
      # the workflow and the test can never silently drift apart on predicate shape.

      - name: Build SLSA-3 provenance predicate — snapshot worker
        run: |
          python -m workers.build.slsa_predicate \
            --image-digest "${{ steps.push-snapshot.outputs.digest }}" \
            --build-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref }}" \
            --repository "${{ github.repository }}" \
            --builder-id "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@${{ github.ref }}" \
            --pins workers/pins.json \
            --dockerfile workers/snapshot/Dockerfile \
            --requirements workers/snapshot/requirements.txt \
            --out slsa-snapshot-predicate.json

      - name: Build SLSA-3 provenance predicate — detector worker
        run: |
          python -m workers.build.slsa_predicate \
            --image-digest "${{ steps.push-detector.outputs.digest }}" \
            --build-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref }}" \
            --repository "${{ github.repository }}" \
            --builder-id "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@${{ github.ref }}" \
            --pins workers/pins.json \
            --dockerfile workers/detector/Dockerfile \
            --requirements workers/detector/requirements.txt \
            --out slsa-detector-predicate.json

      - name: Attest SLSA-3 provenance (Cosign keyless)
        run: |
          cosign attest --yes --type slsaprovenance \
            --predicate slsa-snapshot-predicate.json \
            ${{ env.ECR_REGISTRY }}/scanipy-snapshot@${{ steps.push-snapshot.outputs.digest }}
          cosign attest --yes --type slsaprovenance \
            --predicate slsa-detector-predicate.json \
            ${{ env.ECR_REGISTRY }}/scanipy-detector@${{ steps.push-detector.outputs.digest }}

      - name: Verify SLSA-3 attestations (AC-DEPLOY-04c)
        run: |
          cosign verify-attestation --type slsaprovenance \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.ECR_REGISTRY }}/scanipy-snapshot@${{ steps.push-snapshot.outputs.digest }}
          cosign verify-attestation --type slsaprovenance \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.ECR_REGISTRY }}/scanipy-detector@${{ steps.push-detector.outputs.digest }}

  # ---------------------------------------------------------------------------
  # Deploy to ECS Fargate — renders each task definition with the new image
  # digest (updating both the container image and SCANIPY_ENV_DIGEST env var),
  # registers the new revision, and waits for service stability.
  # ---------------------------------------------------------------------------
  deploy-ecs:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    permissions:
      contents: read
      id-token: write   # OIDC for AWS credential exchange
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --- snapshot worker ---------------------------------------------------

      - name: Fetch snapshot task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition scanipy-snapshot-worker \
            --query taskDefinition \
            --region ${{ env.AWS_REGION }} \
            > snapshot-task-def.json

      - name: Render snapshot task definition — image + SCANIPY_ENV_DIGEST
        id: render-snapshot
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: snapshot-task-def.json
          container-name: snapshot-worker
          image: >-
            ${{ env.ECR_REGISTRY }}/scanipy-snapshot@${{ needs.build-images.outputs.snapshot_digest }}
          environment-variables: |
            SCANIPY_ENV_DIGEST=${{ needs.build-images.outputs.snapshot_digest }}

      - name: Deploy snapshot worker to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-snapshot.outputs.task-definition }}
          service: snapshot-worker
          cluster: scanipy-prod
          wait-for-service-stability: true

      # --- detector worker ---------------------------------------------------

      - name: Fetch detector task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition scanipy-detector-worker \
            --query taskDefinition \
            --region ${{ env.AWS_REGION }} \
            > detector-task-def.json

      - name: Render detector task definition — image + SCANIPY_ENV_DIGEST
        id: render-detector
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: detector-task-def.json
          container-name: detector-worker
          image: >-
            ${{ env.ECR_REGISTRY }}/scanipy-detector@${{ needs.build-images.outputs.detector_digest }}
          environment-variables: |
            SCANIPY_ENV_DIGEST=${{ needs.build-images.outputs.detector_digest }}

      - name: Deploy detector worker to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-detector.outputs.task-definition }}
          service: detector-worker
          cluster: scanipy-prod
          wait-for-service-stability: true

  # ---------------------------------------------------------------------------
  # Register the freshly-deployed digests as the new active env_digest
  # (CLAR-DEPLOY-22). Never pushes to main directly — opens a human-reviewed
  # "env_digest rollover" PR (DOC-CMP-DEPLOY-02 §6.2 / DOC-CMP-DEPLOY-04 §6.2);
  # the PR-only-merge shim + RULE-10 forbid anything else. Registration is
  # effective on merge, not on this job running.
  # ---------------------------------------------------------------------------
  register-env-digest:
    name: Register env_digest (rollover ceremony PR)
    runs-on: ubuntu-latest
    needs: [build-images, deploy-ecs]
    permissions:
      contents: write        # push the registration branch (never main — see above)
      pull-requests: write   # open the rollover-ceremony PR
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Register digests and open the rollover ceremony PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIGNED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python -m workers.build.env_digest_registry register \
            --path workers/env_digest_history.json \
            --image scanipy-snapshot \
            --digest "${{ needs.build-images.outputs.snapshot_digest }}" \
            --tag "${{ github.ref_name }}" \
            --git-sha "${{ github.sha }}" \
            --signed-at "$SIGNED_AT"
          python -m workers.build.env_digest_registry register \
            --path workers/env_digest_history.json \
            --image scanipy-detector \
            --digest "${{ needs.build-images.outputs.detector_digest }}" \
            --tag "${{ github.ref_name }}" \
            --git-sha "${{ github.sha }}" \
            --signed-at "$SIGNED_AT"

          if git diff --quiet -- workers/env_digest_history.json; then
            echo "Registry already reflects ${{ github.ref_name }} digests (idempotent register) — no rollover PR needed."
            exit 0
          fi

          BRANCH="env-digest/${{ github.ref_name }}"
          git config user.name "scanipy-deploy"
          git config user.email "deploy@scanipy"
          git checkout -b "$BRANCH"
          git add workers/env_digest_history.json
          git commit -m "chore(CMP-DEPLOY-04): env_digest rollover — register ${{ github.ref_name }} digests"
          git push origin "$BRANCH"

          # gh pr create exits non-zero on failure; the job's default `-e` shell
          # then fails the job (red run == registry drift is loud, per CLAR-DEPLOY-22).
          gh pr create \
            --title "env_digest rollover: register ${{ github.ref_name }} digests" \
            --body-file .github/PULL_REQUEST_TEMPLATE.md
