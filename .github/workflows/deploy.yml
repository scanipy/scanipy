name: Deploy — ECS Fargate (tagged releases only)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write   # OIDC for AWS credential exchange

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ---------------------------------------------------------------------------
  # Pre-deploy gate checks — all named gates must pass on this commit SHA.
  # Gate 2 (Falsifier CW) also triggers on the same tag push; we wait up to
  # 20 min for it to complete before checking its conclusion.
  # ---------------------------------------------------------------------------
  pre-deploy-checks:
    name: Pre-deploy gate verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all required CI gates passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          # check_gate NAME [MAX_WAIT_SECONDS]
          # Polls until the named check-run posts a conclusion, then verifies it
          # is "success".  MAX_WAIT_SECONDS defaults to 0 (no waiting).
          check_gate() {
            local check_name="$1"
            local max_wait="${2:-0}"
            local elapsed=0
            local result

            while true; do
              result=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" \
                --jq ".check_runs[] | select(.name == \"${check_name}\") | .conclusion" \
                2>/dev/null | tail -1)

              if [ "${result}" = "success" ]; then
                echo "GATE PASS: '${check_name}'"
                return 0
              elif [ -n "${result}" ] && [ "${result}" != "null" ]; then
                echo "GATE FAIL: '${check_name}' conclusion='${result}' on ${SHA}"
                return 1
              fi

              if [ "${elapsed}" -ge "${max_wait}" ]; then
                echo "GATE FAIL: '${check_name}' not found / not complete on ${SHA}"
                return 1
              fi

              echo "Waiting for '${check_name}' … ${elapsed}/${max_wait}s"
              sleep 30
              elapsed=$((elapsed + 30))
            done
          }

          # All four gates wait up to 20 min. Gates 1/3/4 typically complete on the
          # push-to-main CI run before the tag is cut; Gate 2 also fires on this
          # same tag push. The wait loop handles both cases: already-done gates
          # resolve instantly; concurrently-running ones are polled until done.
          failed=0
          check_gate "Gate 1 — DSL proofs (AC-DET-01a)"                                     1200 || failed=1
          check_gate "Gate 2 — Falsifier CW — zero false negatives (AC-SNAP-03a)"           1200 || failed=1
          check_gate "Gate 3 — Attestor core pipeline (AC-CP-05a/c)"                        1200 || failed=1

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "ERROR: One or more required gates did not pass on ${SHA}."
            echo "Do not deploy until all gates are green."
            exit 1
          fi
          echo "All pre-deploy gates verified green."

  # ---------------------------------------------------------------------------
  # Build and push worker images with digest pinning + Cosign signing
  # ---------------------------------------------------------------------------
  build-images:
    name: Build and sign worker images
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    outputs:
      snapshot_digest: ${{ steps.push-snapshot.outputs.digest }}
      detector_digest: ${{ steps.push-detector.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify worker image pins (AC-DEPLOY-02c)
        run: python workers/build/verify_pins.py

      - name: Read tool pins from pins.json
        id: pins
        run: |
          python - <<'PY'
          import json, os
          d = json.load(open("workers/pins.json"))
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"joern_version={d['tools']['joern']['version']}\n")
              f.write(f"joern_sha256={d['tools']['joern']['sha256']}\n")
              f.write(f"codeql_version={d['tools']['codeql']['version']}\n")
              f.write(f"codeql_sha256={d['tools']['codeql']['sha256']}\n")
              f.write(f"git_version={d['tools']['git']['version']}\n")
              f.write(f"git_sha256={d['tools']['git']['sha256']}\n")
          PY

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push snapshot worker
        id: push-snapshot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: workers/snapshot/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/scanipy-snapshot:${{ github.ref_name }}
          build-args: |
            JOERN_VERSION=${{ steps.pins.outputs.joern_version }}
            JOERN_SHA256=${{ steps.pins.outputs.joern_sha256 }}
            CODEQL_VERSION=${{ steps.pins.outputs.codeql_version }}
            CODEQL_SHA256=${{ steps.pins.outputs.codeql_sha256 }}
            GIT_VERSION=${{ steps.pins.outputs.git_version }}
            GIT_SHA256=${{ steps.pins.outputs.git_sha256 }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push detector worker
        id: push-detector
        uses: docker/build-push-action@v5
        with:
          context: .
          file: workers/detector/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/scanipy-detector:${{ github.ref_name }}
          build-args: |
            JOERN_VERSION=${{ steps.pins.outputs.joern_version }}
            JOERN_SHA256=${{ steps.pins.outputs.joern_sha256 }}
            CODEQL_VERSION=${{ steps.pins.outputs.codeql_version }}
            CODEQL_SHA256=${{ steps.pins.outputs.codeql_sha256 }}
            GIT_VERSION=${{ steps.pins.outputs.git_version }}
            GIT_SHA256=${{ steps.pins.outputs.git_sha256 }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images with Cosign (keyless OIDC)
        run: |
          cosign sign --yes \
            ${{ env.ECR_REGISTRY }}/scanipy-snapshot@${{ steps.push-snapshot.outputs.digest }}
          cosign sign --yes \
            ${{ env.ECR_REGISTRY }}/scanipy-detector@${{ steps.push-detector.outputs.digest }}

      - name: Verify Cosign signatures
        run: |
          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.ECR_REGISTRY }}/scanipy-snapshot@${{ steps.push-snapshot.outputs.digest }}
          cosign verify \
            --certificate-identity-regexp \
              "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.ECR_REGISTRY }}/scanipy-detector@${{ steps.push-detector.outputs.digest }}

  # ---------------------------------------------------------------------------
  # Deploy to ECS Fargate — updates task definitions to the new image digests,
  # then rolls out via the service deployment circuit-breaker.
  # ---------------------------------------------------------------------------
  deploy-ecs:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --- snapshot worker ---------------------------------------------------
      # Update both the image AND SCANIPY_ENV_DIGEST env var in the task def,
      # then register the new revision and wait for the service to stabilise.

      - name: Update and deploy snapshot worker task definition
        env:
          SNAPSHOT_DIGEST: ${{ needs.build-images.outputs.snapshot_digest }}
        run: |
          SNAPSHOT_IMAGE="${ECR_REGISTRY}/scanipy-snapshot@${SNAPSHOT_DIGEST}"

          # Fetch, patch image + env_digest, strip read-only fields, register.
          aws ecs describe-task-definition \
            --task-definition scanipy-snapshot-worker \
            --query taskDefinition \
            --region "$AWS_REGION" | \
          jq --arg img "$SNAPSHOT_IMAGE" \
             --arg digest "$SNAPSHOT_DIGEST" \
            '
              .containerDefinitions[0].image = $img |
              .containerDefinitions[0].environment = (
                .containerDefinitions[0].environment //= [] |
                map(select(.name != "SCANIPY_ENV_DIGEST")) +
                [{"name": "SCANIPY_ENV_DIGEST", "value": $digest}]
              ) |
              del(.taskDefinitionArn, .revision, .status,
                  .requiresAttributes, .compatibilities,
                  .registeredAt, .registeredBy, .deregisteredAt)
            ' > snapshot-task-def-new.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://snapshot-task-def-new.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Registered snapshot task definition: ${NEW_ARN}"

          aws ecs update-service \
            --cluster scanipy-prod \
            --service snapshot-worker \
            --task-definition "${NEW_ARN}" \
            --region "$AWS_REGION" > /dev/null

          aws ecs wait services-stable \
            --cluster scanipy-prod \
            --services snapshot-worker \
            --region "$AWS_REGION"
          echo "Snapshot worker deployed and stable."

      # --- detector worker ---------------------------------------------------

      - name: Update and deploy detector worker task definition
        env:
          DETECTOR_DIGEST: ${{ needs.build-images.outputs.detector_digest }}
        run: |
          DETECTOR_IMAGE="${ECR_REGISTRY}/scanipy-detector@${DETECTOR_DIGEST}"

          aws ecs describe-task-definition \
            --task-definition scanipy-detector-worker \
            --query taskDefinition \
            --region "$AWS_REGION" | \
          jq --arg img "$DETECTOR_IMAGE" \
             --arg digest "$DETECTOR_DIGEST" \
            '
              .containerDefinitions[0].image = $img |
              .containerDefinitions[0].environment = (
                .containerDefinitions[0].environment //= [] |
                map(select(.name != "SCANIPY_ENV_DIGEST")) +
                [{"name": "SCANIPY_ENV_DIGEST", "value": $digest}]
              ) |
              del(.taskDefinitionArn, .revision, .status,
                  .requiresAttributes, .compatibilities,
                  .registeredAt, .registeredBy, .deregisteredAt)
            ' > detector-task-def-new.json

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://detector-task-def-new.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Registered detector task definition: ${NEW_ARN}"

          aws ecs update-service \
            --cluster scanipy-prod \
            --service detector-worker \
            --task-definition "${NEW_ARN}" \
            --region "$AWS_REGION" > /dev/null

          aws ecs wait services-stable \
            --cluster scanipy-prod \
            --services detector-worker \
            --region "$AWS_REGION"
          echo "Detector worker deployed and stable."
