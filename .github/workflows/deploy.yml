name: Deploy — ECS Fargate (tagged releases only)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write   # OIDC for AWS credential exchange

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ---------------------------------------------------------------------------
  # Pre-deploy gate checks — all four named gates must show green on this SHA
  # Uses the GitHub Checks API to verify required status checks actually passed.
  # ---------------------------------------------------------------------------
  pre-deploy-checks:
    name: Pre-deploy gate verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify all required CI gates passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"

          check_gate() {
            local check_name="$1"
            local result
            result=$(gh api "repos/${REPO}/commits/${SHA}/check-runs" \
              --jq ".check_runs[] | select(.name == \"${check_name}\") | .conclusion" \
              2>/dev/null | tail -1)

            if [ "${result}" != "success" ]; then
              echo "GATE FAIL: '${check_name}' conclusion='${result:-not found}' on ${SHA}"
              return 1
            fi
            echo "GATE PASS: '${check_name}'"
          }

          failed=0
          check_gate "Gate 1 — DSL proofs (AC-DET-01a)"       || failed=1
          check_gate "Gate 2 — Falsifier CW — zero false negatives (AC-SNAP-03a)" || failed=1
          check_gate "Gate 3 — Attestor core pipeline (AC-CP-05a/c)" || failed=1

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "ERROR: One or more required gates did not pass on ${SHA}."
            echo "Do not deploy until all gates are green."
            exit 1
          fi
          echo "All pre-deploy gates verified green."

  # ---------------------------------------------------------------------------
  # Build and push worker images with digest pinning + Cosign signing
  # ---------------------------------------------------------------------------
  build-images:
    name: Build and sign worker images
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    outputs:
      snapshot_digest: ${{ steps.push-snapshot.outputs.digest }}
      detector_digest: ${{ steps.push-detector.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push snapshot worker
        id: push-snapshot
        uses: docker/build-push-action@v5
        with:
          context: workers/snapshot
          push: true
          tags: ${{ env.ECR_REGISTRY }}/scanipy-snapshot:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push detector worker
        id: push-detector
        uses: docker/build-push-action@v5
        with:
          context: workers/detector
          push: true
          tags: ${{ env.ECR_REGISTRY }}/scanipy-detector:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign images with Cosign (keyless OIDC)
        run: |
          cosign sign --yes ${{ env.ECR_REGISTRY }}/scanipy-snapshot@${{ steps.push-snapshot.outputs.digest }}
          cosign sign --yes ${{ env.ECR_REGISTRY }}/scanipy-detector@${{ steps.push-detector.outputs.digest }}

  # ---------------------------------------------------------------------------
  # Deploy to ECS Fargate
  # ---------------------------------------------------------------------------
  deploy-ecs:
    name: Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service — snapshot worker
        run: |
          aws ecs update-service \
            --cluster scanipy-prod \
            --service snapshot-worker \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Update ECS service — detector worker
        run: |
          aws ecs update-service \
            --cluster scanipy-prod \
            --service detector-worker \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment stability
        run: |
          aws ecs wait services-stable \
            --cluster scanipy-prod \
            --services snapshot-worker detector-worker \
            --region ${{ env.AWS_REGION }}
