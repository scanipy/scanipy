name: Gate 3 — Attestor core (every detector/engine/Env change)

on:
  push:
    branches: [main]
    paths:
      - "detectors/**"
      - "analysis/**"
      - "workers/**"
      - "services/scan/**"
      - "services/snapshot/**"
  pull_request:
    paths:
      - "detectors/**"
      - "analysis/**"
      - "workers/**"
      - "services/scan/**"
      - "services/snapshot/**"
  workflow_dispatch:

# Cancel only superseded PR runs. Main runs are release blockers (Gate
# 3 — AC-CP-05c) and must complete; cancelling one mid-determinism
# canary would record a partial partition.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Gate 3 — Attestor core pipeline
  # AC-CP-05c: core partition byte-identical across two independent pipelines
  # Determinism regression is a hard release blocker.
  # ---------------------------------------------------------------------------
  attestor-core:
    name: "Gate 3 — Attestor core pipeline (AC-CP-05a/c)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check canary corpus exists
        run: |
          if [ ! -d "tests/corpora/canary" ]; then
            echo "WARNING: tests/corpora/canary/ not found. TST-AC-CORE-01a will be skipped."
            echo "CMP-CORP-CANARY-01 must be DONE before Attestor can run the full 100-repo suite."
          fi

      # Gate-3 selector widening (security co-sign rec on #293, accepted):
      # the original -k "attestor or determinism or core_partition" did NOT
      # collect the oracle-never-claims-theorem contract test
      # (test_cp05b_oracle_pipeline_reports_rate_never_theorem), because its
      # node name carries no "attestor"/"determinism"/"core_partition"
      # substring. Adding `or cp05b` widens the selector to ALSO collect that
      # one test. `cp05b` is unique repo-wide (verified by --collect-only), so
      # the widening adds exactly +1 test and nothing unintended. cp05b is an
      # @pytest.mark.invariant test, so the "invariant or empirical" marker gate
      # keeps it; it runs GREEN today (CP-05 landed in #293), so this gate is
      # not vacuous.
      - name: Assert Gate-3 selector collects the cp05b oracle-theorem contract
        # Workflow-side falsifier (drift guard for the -k expression): if a
        # future edit narrows -k so cp05b is dropped, this step FAILS the
        # workflow before the suite runs. This is the gate-side analogue of the
        # committed-table drift guard. A deliberately-wrong -k (e.g. dropping
        # `or cp05b`) makes the grep miss and this step exit 1.
        run: |
          if ! pytest tests/ \
            -m "invariant or empirical" \
            -k "attestor or determinism or core_partition or cp05b" \
            --collect-only 2>/dev/null \
            | grep -q "test_cp05b_oracle_pipeline_reports_rate_never_theorem"; then
            echo "::error::Gate-3 -k no longer collects the cp05b oracle-theorem" \
                 "contract (test_cp05b_oracle_pipeline_reports_rate_never_theorem)." \
                 "Restore 'or cp05b' in the -k expression."
            exit 1
          fi
          echo "Gate-3 selector collects the cp05b oracle-theorem contract test."

      - name: Run Attestor core tests
        run: |
          pytest tests/ \
            -m "invariant or empirical" \
            -k "attestor or determinism or core_partition or cp05b" \
            -q --tb=long -v \
            --junit-xml=attestor-results.xml
        env:
          SCANIPY_ENV: test
          LLM_TRIAGE: "off"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attestor-results
          path: attestor-results.xml

  # ---------------------------------------------------------------------------
  # Determinism check — TST-AC-CORE-01a
  # 100 canary repos × 5 re-runs — SARIF must be byte-identical.
  # (Skipped if canary corpus not yet DONE.)
  #
  # NOTE: hashFiles() is NOT allowed at the job-level `if:` (only inside
  # steps — see GitHub Actions context-availability docs). The original
  # scaffold had `if: hashFiles(...) != ''` here, which caused this
  # workflow to fail at parse time on every push since 00c5bfe. The
  # fix moves the corpus-presence check into a first step that emits a
  # `has_corpus` output, and gates every subsequent step on it.
  # ---------------------------------------------------------------------------
  determinism-canary:
    name: "Determinism — 100 canary repos × 5 re-runs (TST-AC-CORE-01a)"
    runs-on: ubuntu-latest
    needs: attestor-core
    steps:
      - uses: actions/checkout@v4

      - name: Detect canary corpus presence
        id: corpus_check
        run: |
          if [ -f "tests/corpora/canary/corpus.lock" ]; then
            echo "has_corpus=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_corpus=false" >> "$GITHUB_OUTPUT"
            echo "Canary corpus not present — TST-AC-CORE-01a skipped (CMP-CORP-CANARY-01 not DONE)."
          fi

      - uses: actions/setup-python@v5
        if: steps.corpus_check.outputs.has_corpus == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        if: steps.corpus_check.outputs.has_corpus == 'true'
        run: pip install -e ".[dev]"

      - name: Run determinism canary suite
        if: steps.corpus_check.outputs.has_corpus == 'true'
        run: |
          pytest tests/ \
            -m "empirical" \
            -k "determinism_canary" \
            -q --tb=long -v
        env:
          SCANIPY_ENV: test
