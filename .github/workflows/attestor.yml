name: Gate 3 — Attestor core (every detector/engine/Env change)

on:
  push:
    branches: [main]
    paths:
      - "detectors/**"
      - "analysis/**"
      - "workers/**"
      - "services/scan/**"
      - "services/snapshot/**"
  pull_request:
    paths:
      - "detectors/**"
      - "analysis/**"
      - "workers/**"
      - "services/scan/**"
      - "services/snapshot/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Gate 3 — Attestor core pipeline
  # AC-CP-05c: core partition byte-identical across two independent pipelines
  # Determinism regression is a hard release blocker.
  # ---------------------------------------------------------------------------
  attestor-core:
    name: "Gate 3 — Attestor core pipeline (AC-CP-05a/c)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install pytest

      - name: Check canary corpus exists
        run: |
          if [ ! -d "tests/corpora/canary" ]; then
            echo "WARNING: tests/corpora/canary/ not found. TST-AC-CORE-01a will be skipped."
            echo "CMP-CORP-CANARY-01 must be DONE before Attestor can run the full 100-repo suite."
          fi

      - name: Run Attestor core tests
        run: |
          pytest tests/ \
            -m "invariant or empirical" \
            -k "attestor or determinism or core_partition" \
            -q --tb=long -v \
            --junit-xml=attestor-results.xml
        env:
          SCANIPY_ENV: test
          LLM_TRIAGE: "off"

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attestor-results
          path: attestor-results.xml

  # ---------------------------------------------------------------------------
  # Determinism check — TST-AC-CORE-01a
  # 100 canary repos × 5 re-runs — SARIF must be byte-identical
  # (Skipped if canary corpus not yet DONE)
  # ---------------------------------------------------------------------------
  determinism-canary:
    name: "Determinism — 100 canary repos × 5 re-runs (TST-AC-CORE-01a)"
    runs-on: ubuntu-latest
    needs: attestor-core
    if: hashFiles('tests/corpora/canary/corpus.lock') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install pytest

      - name: Run determinism canary suite
        run: |
          pytest tests/ \
            -m "empirical" \
            -k "determinism_canary" \
            -q --tb=long -v
        env:
          SCANIPY_ENV: test
