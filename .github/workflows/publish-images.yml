# DOCKER-03 (CLAR-DEPLOY-25) — publish the self-host application image to GHCR,
# Cosign keyless-signed. Successor to the AWS-OIDC → ECR path in deploy.yml
# (superseded by the Docker/OSS pivot). Uses the built-in GITHUB_TOKEN for GHCR
# (no long-lived cloud credentials) and GitHub's OIDC identity for keyless
# signing.
#
# The GHCR image digest is the running deployment's env_digest producer (INV-2):
# publishing a new image is an env_digest rollover (see CLAR-DEPLOY-25 §3).
name: Publish images (GHCR)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write # push to GHCR
  id-token: write # cosign keyless (sigstore) via GitHub OIDC

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app-image:
    name: Build + sign scanipy app image
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/scanipy
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=long

      - name: Build + push (SBOM + provenance attestations)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign keyless-sign the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Report published digest (env_digest rollover input)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published ${IMAGE}@${DIGEST}"
          echo "This digest is the deployment's env_digest (INV-2). Register it via the"
          echo "env_digest rollover ceremony (workers/env_digest_history.json) if this image"
          echo "backs a deterministic-core deployment (CLAR-DEPLOY-25 §3)."
