name: Canary — SCM parity + nightly regression

on:
  schedule:
    # Nightly at 03:30 UTC (after falsifier-cw completes)
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # SCM parity — TST-AC-SCM-03c
  # 100 canary repos must resolve identical commits across GitHub/GitLab/BB/ADO.
  #
  # NOTE: hashFiles() is NOT allowed at the job-level `if:` (only inside
  # steps — see GitHub Actions context-availability docs). The original
  # scaffold had `if: hashFiles(...) != ''` here, which caused this
  # workflow to fail at parse time on every push since 00c5bfe. The
  # fix moves the corpus-presence check into a first step that emits a
  # `has_corpus` output, and gates every subsequent step on it.
  # ---------------------------------------------------------------------------
  scm-parity:
    name: SCM parity — 100 canary repos (TST-AC-SCM-03c)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect canary corpus presence
        id: corpus_check
        run: |
          if [ -f "tests/corpora/canary/corpus.lock" ]; then
            echo "has_corpus=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_corpus=false" >> "$GITHUB_OUTPUT"
            echo "Canary corpus not present — TST-AC-SCM-03c skipped (CMP-CORP-CANARY-01 not DONE)."
          fi

      - uses: actions/setup-python@v5
        if: steps.corpus_check.outputs.has_corpus == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        if: steps.corpus_check.outputs.has_corpus == 'true'
        run: pip install -e ".[dev]"

      - name: Run SCM parity tests
        if: steps.corpus_check.outputs.has_corpus == 'true'
        run: |
          pytest tests/integration/ \
            -m "integration" \
            -k "scm_parity or canary" \
            -q --tb=short -v \
            --junit-xml=canary-scm-results.xml
        env:
          SCANIPY_ENV: test

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always() && steps.corpus_check.outputs.has_corpus == 'true'
        with:
          name: canary-scm-results
          path: canary-scm-results.xml

  # ---------------------------------------------------------------------------
  # Nightly regression — full test suite
  # ---------------------------------------------------------------------------
  nightly-regression:
    name: Nightly regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        # dev,http: this job's pytest invocation scopes to `tests/` unscoped,
        # so collection imports every module under tests/unit/ — including
        # the CLAR-DEPLOY-19 HTTP adapter suite — before any -m filter
        # applies. Without the http extra, collection fails with
        # ModuleNotFoundError: fastapi before a single test runs.
        run: pip install -e ".[dev,http]" pytest-cov

      - name: Run nightly tests
        run: |
          pytest tests/ \
            -m "unit or integration or nightly" \
            -q --tb=short \
            --cov=. --cov-report=xml \
            --junit-xml=nightly-results.xml
        env:
          SCANIPY_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-coverage
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Gate-4 daily heartbeat — eprocess.martingale_test_status datapoint
  # (CMP-DEPLOY-03 §3.4 metric 10, CLAR-DEPLOY-20 cadence: once daily via this
  # cron so the SampleCount<1 absence alarm — enabled at Stage-A go-live — is
  # never fail-open. The publish is non-gating; the job verdict is the pytest
  # exit code. The direct-CloudWatch lane stays dormant until
  # SCANIPY_METRICS_CW_DIRECT=1 + AWS OIDC credentials are wired into this
  # workflow (live-ops follow-up); until then the publisher is a hermetic
  # no-op that logs the would-be datapoint.
  # NOTE (metric 8, attestor.core_diff_count): its emitter lives inside
  # attest_scan (services/scan/attestor.py) and its daily live datapoint needs
  # the deployed attestor run — the nightly-regression job above already
  # exercises attest_scan hermetically; the live heartbeat lands with the
  # substrate track.
  # ---------------------------------------------------------------------------
  gate4-heartbeat:
    name: "Gate-4 heartbeat — martingale status daily datapoint (CLAR-DEPLOY-20)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Gate-4 martingale tests and publish the daily status datapoint
        # Mirrors the ci.yml eprocess-unit scaffold-phase guard (CMP-TRI-02 not
        # yet implemented: tests/falsifier/eprocess/ has only __init__.py, so
        # a bare `pytest tests/falsifier/eprocess/` exits 5 "no tests
        # collected" and would fail this heartbeat every night with no
        # TST-AC-TRI-02b tests to run). Skip cleanly with a visible message
        # until the first test_*.py lands; the guard then auto-flips and the
        # daily heartbeat starts enforcing.
        run: |
          if find tests/falsifier/eprocess/ -name 'test_*.py' 2>/dev/null | grep -q .; then
            if pytest tests/falsifier/eprocess/ -q --tb=short; then
              gate4_status=1
            else
              gate4_status=0
            fi
            python scripts/publish_gate4_status.py --status "$gate4_status" \
              || echo "Gate-4 status publish failed (non-gating)"
            [ "$gate4_status" = "1" ] || exit 1
          else
            echo "Scaffold phase — no TST-AC-TRI-02b tests in tests/falsifier/eprocess/ yet (CMP-TRI-02 not implemented). Gate-4 heartbeat will enforce once tests land."
          fi
        env:
          SCANIPY_ENV: test
